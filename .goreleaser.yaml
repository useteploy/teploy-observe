version: 2

project_name: teploy-observe

builds:
  - id: teploy-observe
    main: ./cmd/observe
    # Command/binary name is the short `observe` (repo stays namespaced
    # teploy-observe, like ripgrep's repo vs the `rg` command). Keep this in sync
    # with scripts/install.sh (installs `observe`) and the brew formula below.
    binary: observe
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: teploy-observe-tar
    formats: [tar.gz]
    # Asset name uses the short command name `observe` (not ProjectName), so the
    # download URL in scripts/install.sh resolves: observe_<ver>_<os>_<arch>.tar.gz
    name_template: >-
      observe_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}
    files:
      - packaging/systemd/observe.service

checksum:
  name_template: 'checksums.txt'

# The updater verifies this Ed25519 signature before trusting any archive hash.
# The private key exists only in the protected GitHub Actions release secret.
signs:
  - id: release-checksum
    artifacts: checksum
    signature: '${artifact}.sig'
    cmd: openssl
    args:
      - pkeyutl
      - -sign
      - -rawin
      - -inkey
      - '{{ .Env.OBSERVE_SIGNING_KEY_PATH }}'
      - -in
      - '${artifact}'
      - -out
      - '${signature}'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# Docker / GHCR multi-arch image built from the already compiled binaries.
dockers_v2:
  - id: teploy-observe
    ids: [teploy-observe]
    dockerfile: Dockerfile.goreleaser
    images: [ghcr.io/useteploy/teploy-observe]
    tags:
      - '{{ .Version }}'
      - latest
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: '{{ .ProjectName }}'
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.revision: '{{ .FullCommit }}'
      org.opencontainers.image.source: https://github.com/useteploy/teploy-observe
      org.opencontainers.image.licenses: AGPL-3.0-or-later

homebrew_casks:
  - name: observe
    ids: [teploy-observe-tar]
    binaries: [observe]
    repository:
      owner: useteploy
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'  # populated from secrets.HOMEBREW_TAP_TOKEN in release.yml
    homepage: 'https://github.com/useteploy/teploy-observe'
    description: 'Self-hosted, single-binary replacement for PostHog + Umami + SigNoz + Sentry'
