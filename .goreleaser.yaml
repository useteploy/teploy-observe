version: 2

project_name: observe

builds:
  - id: observe
    main: ./cmd/observe
    binary: observe
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: observe-tar
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# Docker / GHCR multi-arch images. goreleaser copies the pre-built binary
# into Dockerfile.goreleaser's build context, so no vendor/ or Go toolchain
# is needed at image-build time. The from-source Dockerfile stays for
# `docker compose up` dev use.
dockers:
  - id: observe-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - 'ghcr.io/useteploy/observe:{{ .Version }}-amd64'
      - 'ghcr.io/useteploy/observe:latest-amd64'
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source=https://github.com/useteploy/teploy-observe'
      - '--label=org.opencontainers.image.licenses=AGPL-3.0-or-later'
  - id: observe-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - 'ghcr.io/useteploy/observe:{{ .Version }}-arm64'
      - 'ghcr.io/useteploy/observe:latest-arm64'
    build_flag_templates:
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source=https://github.com/useteploy/teploy-observe'
      - '--label=org.opencontainers.image.licenses=AGPL-3.0-or-later'

docker_manifests:
  - name_template: 'ghcr.io/useteploy/observe:{{ .Version }}'
    image_templates:
      - 'ghcr.io/useteploy/observe:{{ .Version }}-amd64'
      - 'ghcr.io/useteploy/observe:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/useteploy/observe:latest'
    image_templates:
      - 'ghcr.io/useteploy/observe:latest-amd64'
      - 'ghcr.io/useteploy/observe:latest-arm64'

brews:
  - name: observe
    repository:
      owner: useteploy
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'  # populated from secrets.HOMEBREW_TAP_TOKEN in release.yml
    homepage: 'https://github.com/useteploy/teploy-observe'
    description: 'Self-hosted, single-binary replacement for PostHog + Umami + SigNoz + Sentry'
    license: 'AGPL-3.0-or-later'
    install: |
      bin.install "observe"
    test: |
      system "#{bin}/observe", "version"
