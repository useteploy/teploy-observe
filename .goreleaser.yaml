version: 2

project_name: observe

builds:
  - id: observe
    main: ./cmd/observe
    binary: observe
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: observe-tar
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# Docker / GHCR images deferred to v0.1.1 — Dockerfile needs vendor/ in
# the goreleaser build context (extra_files), and the COPY semantics
# need to match the binary-from-dist pattern goreleaser prefers. Users
# can `docker compose up` from a fresh clone in the meantime per README.

brews:
  - name: observe
    repository:
      owner: useteploy
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/useteploy/teploy-observe'
    description: 'Self-hosted, single-binary replacement for PostHog + Umami + SigNoz + Sentry'
    license: 'AGPL-3.0-or-later'
    install: |
      bin.install "observe"
    test: |
      system "#{bin}/observe", "--version"
