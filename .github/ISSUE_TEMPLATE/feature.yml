name: Feature request
description: Suggest a new capability for Observe.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Rough shape of the solution (endpoint, UI surface, config).
  - type: checkboxes
    id: fit
    attributes:
      label: Fit check
      options:
        - label: Aligns with the single-binary / self-host story (no Kafka / Kubernetes).
        - label: Either enterprise-scale (out of scope) or breaks first-5-minute UX — I understand this.
