name: Release

on:
  push:
    tags:
      - 'v*'
      - 'sdk-browser-v*'
      - 'sdk-sentry-shim-v*'
      - 'sdk-python-v*'

permissions:
  contents: read

# UI dist is committed at cmd/observe/ui/dist/, so goreleaser packages it
# directly — no pnpm or Neutron source needed at release time. Devs who
# edit UI sources locally must run scripts/ui-sync.sh and commit the
# regenerated dist before tagging.

jobs:
  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test release build
        run: go test ./...
      - name: Configure release signing key
        env:
          OBSERVE_RELEASE_SIGNING_KEY: ${{ secrets.OBSERVE_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$OBSERVE_RELEASE_SIGNING_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/observe-release-key.pem"
          printf '%s' "$OBSERVE_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/observe-release-key.pem"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: 'v2.17.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OBSERVE_SIGNING_KEY_PATH: ${{ runner.temp }}/observe-release-key.pem
      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/observe-release-key.pem"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign release image
        env:
          IMAGE: ghcr.io/useteploy/teploy-observe
        run: cosign sign --yes "$IMAGE:${GITHUB_REF_NAME#v}"

  npm-browser:
    if: startsWith(github.ref, 'refs/tags/sdk-browser-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        working-directory: sdk/browser
        run: |
          npm install
          npm run build
      - name: Publish
        working-directory: sdk/browser
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  npm-sentry-shim:
    if: startsWith(github.ref, 'refs/tags/sdk-sentry-shim-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        working-directory: sdk/sentry-shim
        run: |
          npm install
          npm run build
      - name: Publish
        working-directory: sdk/sentry-shim
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref, 'refs/tags/sdk-python-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish to PyPI
        working-directory: sdk/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
