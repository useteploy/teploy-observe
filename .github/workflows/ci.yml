name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R45 (round 4): least-privilege default (no job here needs write access),
# and a superseded push to the same branch cancels its own stale run.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repo embeds the built UI at cmd/observe/ui/dist/ as part of the
# repo (single-binary story). CI only needs to build + test the Go code
# — no pnpm, no Rust toolchain, no Nucleus build. Local devs run
# scripts/ui-sync.sh after editing UI sources.

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Validate installer
        run: sh -n scripts/install.sh
      - name: Test
        run: go test ./...
      # AUD-056 (round 2): the concurrency-heavy packages get the race
      # detector — the batch-admission, WAL, replay-lock, and audit-head
      # regressions from this audit series are exactly the class of bug a
      # plain `go test` passes.
      - name: Race regression tests
        run: go test -race ./internal/ingest/... ./internal/audit/... ./internal/replays/... ./internal/auth/... ./internal/backup/...

  # AUD-056 (round 2): the classic replay tracker is a separately shipped
  # surface; these contract tests execute the real served script in a vm
  # sandbox (lifecycle, delivery retention, beacon policy).
  tracker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/tracker/*.test.mjs

  sdk-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Test SDK
        working-directory: sdk/go
        run: go test -race ./...

  # Audit F49: the browser and Python SDK contracts were only exercised
  # locally, so transport regressions (F29-F33, F51) passed the required
  # checks. Node 20 and Python 3.12 match the versions the SDKs declare.
  sdk-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck
        working-directory: sdk/browser
        run: |
          npm ci
          npm run typecheck
      - name: Test
        working-directory: sdk/browser
        run: npm test
      - name: Build
        working-directory: sdk/browser
        run: npm run build

  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          python -m pytest tests -q

  # F49: embedded-UI freshness gate. The UI is embedded into the Go binary
  # from cmd/observe/ui/dist, so a source edit without a ui-sync run ships a
  # stale dashboard. This job provisions the Neutron TS workspace at the
  # PINNED submodule revision (the same pin the go.mod replace points the
  # working tree at), runs scripts/ui-sync.sh, and fails on any drift.
  ui-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Resolve pinned Neutron revision
        id: pin
        run: echo "sha=$(git ls-tree HEAD Neutron | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Clone Neutron at the pinned revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/neutron-build/neutron ../Neutron
          git -C ../Neutron checkout "${{ steps.pin.outputs.sha }}"
      - name: Install pnpm
        # TO-048: pinned to the exact version the Neutron workspace
        # declares (its packageManager field); an unpinned pnpm@latest
        # made this otherwise source-pinned rebuild depend on whatever
        # the package manager did that week.
        run: |
          set -eu
          version=$(cat .ci/pnpm-version)
          case "$version" in
            ''|*[!0-9.]*) echo 'invalid pinned pnpm version in .ci/pnpm-version' >&2; exit 1 ;;
          esac
          corepack enable
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - name: Provision TS workspace
        run: pnpm -C ../Neutron/typescript install --frozen-lockfile
      - name: ui-sync (build + embed)
        run: sh scripts/ui-sync.sh
        env:
          OBSERVE_BIN: /tmp/observe-ui-sync
      - name: Embedded dist must be fresh
        run: git diff --exit-code -- cmd/observe/ui/dist

  # AUD-056 remainder: the DB-backed suites ran only when a developer had a
  # local Nucleus. This job runs them against a pinned published Nucleus
  # image, fresh per run.
  #
  # Why the published image and not a from-source build of the pinned
  # Neutron submodule: reproducibility and CI cost. The from-source ladder
  # breakage this comment used to document (rename visibility, migration
  # 027) was fixed upstream on 2026-09-18 (Neutron 6286531a) and
  # repo-built engines pass the full migration ladder again — the
  # lease-capability job below builds from the pin and relies on it. This
  # job keeps the published v0.1.8 fixture for compatibility coverage;
  # its known flake (intermittent committed-upsert loss on accumulated
  # data, also fixed in the tree) is why the capability job exists
  # separately rather than replacing this one.
  # X01: the vendor/ tree is what actually compiles, but go.mod's replace
  # points at a LOCAL Neutron checkout — nothing proved vendor/ matches the
  # pinned submodule until this check. Drift here means the shipped build
  # and the reviewed pin are different code.
  vendor-pin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Vendored neutron-go must equal the pinned submodule
        run: |
          # Invariant: every file under vendor/github.com/neutron-build/neutron/go
          # is byte-identical to the same path under the Neutron submodule pin;
          # vendored files absent from the pin are drift. LICENSE is exempt
          # (carried for license compliance, not build input). NOT a whole-tree
          # diff: the pin legitimately contains packages vendor/ doesn't import.
          cd vendor/github.com/neutron-build/neutron/go
          find . -type f | while read f; do
            [ "$f" = "./LICENSE" ] && continue
            if [ ! -e "../../../../../Neutron/go/$f" ]; then
              echo "VENDOR-ONLY: $f"
            elif ! cmp -s "$f" "../../../../../Neutron/go/$f"; then
              echo "CONTENT-DIFF: $f"
            fi
          done > /tmp/parity-drift.txt
          if [ -s /tmp/parity-drift.txt ]; then
            cat /tmp/parity-drift.txt >&2
            echo "vendor/github.com/neutron-build/neutron/go differs from the Neutron submodule pin." >&2
            echo "Regenerate from the pin (worktree the pin, point go.mod's replace at it," >&2
            echo "go mod vendor, restore the workspace replace) and commit both together." >&2
            exit 1
          fi

  # X01 compatibility matrix: the same suite against the engine version
  # production actually runs (v1.1.1) on arm64. This combination found two
  # real defects the v0.1.8 job structurally cannot see (the version-tie
  # ambiguity — fast native runs collide at millisecond granularity while
  # slower CI engines never do — and the v0.1.8 arm64 image is broken
  # outright: GLIBC_2.38 not found). Do not remove; widen deliberately.
  nucleus-integration-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Start pinned Nucleus v1.1.1
        run: |
          docker run -d --name nucleus -p 55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:v1.1.1 \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-migration-boot \
          OBSERVE_JWT_SECRET=ci-migration-secret \
          /tmp/observe &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Full suite against live Nucleus v1.1.1
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
        run: go test -p 1 ./...

  nucleus-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Start pinned Nucleus
        run: |
          docker run -d --name nucleus -p 55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:v0.1.8 \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-migration-boot \
          OBSERVE_JWT_SECRET=ci-migration-secret \
          /tmp/observe &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Full suite against live Nucleus
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
        # Serial: concurrent packages racing schema.Apply trip the known
        # upstream Migrate ledger TOCTOU (documented in AUDIT_OPEN.md).
        run: go test -p 1 ./...

  # e2e (AUD-056 remainder): smoke + core — login -> dashboard renders ->
  # one replay plays/pauses/seeks -> audit view renders — against the real
  # binary + real Nucleus. The fuller e2e suite is still local-only; this is
  # the honest browser-level check of the product's core surface.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start pinned Nucleus
        run: |
          docker run -d --name nucleus -p 55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:v1.1.0 \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Generate per-run test JWT secret
        # R44 (round 4): the inline literal violated the app's own >=16-char
        # policy, so the job could never pass startup validation.
        run: echo "E2E_JWT_SECRET=ci-e2e-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Boot observe (seeded)
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=observe-e2e-pass \
          OBSERVE_JWT_SECRET="$E2E_JWT_SECRET" \
          OBSERVE_SEED_DEMO=true \
          /tmp/observe >/tmp/observe-ci.log 2>&1 &
          OBS_PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$OBS_PID" 2>/dev/null; then
              cat /tmp/observe-ci.log >&2
              wait "$OBS_PID" || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          exit 1
      - name: Playwright smoke + core
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke.spec.ts tests/core.spec.ts
        env:
          OBSERVE_URL: http://127.0.0.1:3000

  # TO-047: the lease capability job. The pinned v0.1.8 image predates
  # ACQUIRE SNAPSHOT LEASE, so its green runs prove nothing about the
  # consistent-backup path (lease live tests legitimately skip there).
  # This job builds the engine from the SAME pinned Neutron revision the
  # go.mod replace points the working tree at, boots it, applies the
  # migration ladder, and runs the backup/lease suites with
  # OBSERVE_REQUIRE_SNAPSHOT_LEASE=1 — a missing lease FAILS instead of
  # skipping, so a green run means the snapshot-lease guarantee actually
  # executed against the source the product compiles against.
  nucleus-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned Neutron revision
        id: pin
        run: echo "sha=$(git ls-tree HEAD Neutron | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../Neutron/nucleus/target
          key: nucleus-lease-${{ steps.pin.outputs.sha }}
      - name: Clone Neutron at the pinned revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/neutron-build/neutron ../Neutron
          git -C ../Neutron checkout "${{ steps.pin.outputs.sha }}"
      - name: Build engine
        run: cargo build --release --manifest-path ../Neutron/nucleus/Cargo.toml --bin nucleus
      - name: Start pinned-revision engine
        run: |
          ../Neutron/nucleus/target/release/nucleus start \
            --host 127.0.0.1 --port 55432 --cluster-port 55433 \
            --data /tmp/nucleus-lease-data --max-memory 512 &
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Generate per-run test JWT secret
        # R44 (round 4): same policy fix as e2e-smoke.
        run: echo "LEASE_JWT_SECRET=ci-lease-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-lease-migration-boot \
          OBSERVE_JWT_SECRET="$LEASE_JWT_SECRET" \
          /tmp/observe >/tmp/observe-ci.log 2>&1 &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if ! kill -0 "$OBS_PID" 2>/dev/null; then
              cat /tmp/observe-ci.log >&2
              wait "$OBS_PID" || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Lease-required backup suite
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
          OBSERVE_REQUIRE_SNAPSHOT_LEASE: "1"
        run: go test -p 1 -count=1 ./internal/backup/... ./internal/audit/... ./internal/replays/...
