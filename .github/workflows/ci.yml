name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R45 (round 4): least-privilege default (no job here needs write access),
# and a superseded push to the same branch cancels its own stale run.
permissions:
  contents: read
# One Nucleus image version for every job, the staticcheck pin, and the
# concurrency policy. NUCLEUS_VERSION is the engine version CI tests
# against and production runs (teploy.yml pins the same tag;
# docker-compose.yml defaults to it). One place to bump.
env:
  NUCLEUS_VERSION: v1.3.0
  STATICCHECK_VERSION: 2025.1.1
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repo embeds the built UI at cmd/observe/ui/dist/ as part of the
# repo (single-binary story). Reusable release assurance below requires
# freshness, locked replay regeneration, SDKs, race, browser and live engines.

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Validate installer
        run: sh -n scripts/install.sh
      - name: gofmt
        # Non-vendor, non-Neutron Go files only; any output fails the job.
        run: |
          out=$(git ls-files '*.go' | grep -v -e '^vendor/' -e '^Neutron/' | xargs gofmt -l)
          if [ -n "$out" ]; then
            echo "unformatted files (run gofmt -w):" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: Test
        run: go test ./...

  # Full race detector over the main module (supersedes the old partial
  # list in the go job). Separate job so it runs in parallel with the plain
  # suite; DB-backed tests skip here (no Nucleus), which keeps it bounded.
  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Race
        run: go test -race ./...

  # Known-vulnerability scan over the module graph. Separate job so a new
  # advisory is its own red check rather than hiding in `go`. Intended to
  # be BLOCKING once the first run is triaged (stdlib findings clear by
  # bumping the Go toolchain, dependency findings by go.mod).
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          staticcheck ./...

  # AUD-056 (round 2): the classic replay tracker is a separately shipped
  # surface; these contract tests execute the real served script in a vm
  # sandbox (lifecycle, delivery retention, beacon policy).
  tracker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/tracker/*.test.mjs
      # O06: the rrweb delta recorder's sanitizer fixtures are
      # dependency-free pure modules — pinned here without an npm install.
      # (smoke.mjs / player-smoke.mjs need system Chrome and stay manual.)
      - run: node --test cmd/observe/tracker/replay-delta/test/sanitizer.test.mjs
      # Survey widget and replay-capture contract tests (vm sandbox, no deps).
      - run: node --test cmd/observe/tracker/test/*.test.mjs

  # Pure-logic UI unit tests (helpers, API shapes). Needs Node >= 22.6 for
  # --experimental-strip-types; no npm install required.
  ui-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: ui
        run: node --test --experimental-strip-types 'src/**/*.test.ts'

  sdk-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Test SDK
        working-directory: sdk/go
        run: go test -race ./...

  # Audit F49: the browser and Python SDK contracts were only exercised
  # locally, so transport regressions (F29-F33, F51) passed the required
  # checks. Node 20 and Python 3.12 match the versions the SDKs declare.
  sdk-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck
        working-directory: sdk/browser
        run: |
          npm ci
          npm run typecheck
      - name: Test
        working-directory: sdk/browser
        run: npm test
      - name: Build
        working-directory: sdk/browser
        run: npm run build

  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: sdk/python
        run: |
          python -m pip install --no-deps -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests -q

  # F49: embedded-UI freshness gate. The UI is embedded into the Go binary
  # from cmd/observe/ui/dist, so a source edit without a ui-sync run ships a
  # stale dashboard. This job provisions the Neutron TS workspace at the
  # PINNED submodule revision (the same pin the go.mod replace points the
  # working tree at), runs scripts/ui-sync.sh, and fails on any drift.
  ui-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Resolve pinned Neutron revision
        id: pin
        run: echo "sha=$(git ls-tree HEAD Neutron | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Clone Neutron at the pinned revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/neutron-build/neutron ../Neutron
          git -C ../Neutron checkout "${{ steps.pin.outputs.sha }}"
      - name: Install pnpm
        # TO-048: pinned to the exact version the Neutron workspace
        # declares (its packageManager field); an unpinned pnpm@latest
        # made this otherwise source-pinned rebuild depend on whatever
        # the package manager did that week.
        run: |
          set -eu
          version=$(cat .ci/pnpm-version)
          case "$version" in
            ''|*[!0-9.]*) echo 'invalid pinned pnpm version in .ci/pnpm-version' >&2; exit 1 ;;
          esac
          corepack enable
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - name: Add Observe to the isolated pinned workspace
        run: node .ci/prepare-ui-workspace.mjs ../Neutron
      - name: Provision TS workspace
        run: pnpm -C ../Neutron/typescript install --frozen-lockfile
      - name: Build framework and CLI from the pinned source
        run: pnpm -C ../Neutron/typescript --filter '@neutron-build/cli...' run build
      - name: ui-sync (build + embed)
        run: bash scripts/ui-sync.sh
        env:
          OBSERVE_BIN: /tmp/observe-ui-sync
          NEUTRON_ROOT: ${{ github.workspace }}/../Neutron
      - name: Embedded dist must be fresh
        run: |
          git diff --exit-code -- cmd/observe/ui/dist
          test -z "$(git status --porcelain --untracked-files=all -- cmd/observe/ui/dist)"

  # AUD-056 remainder: the DB-backed suites ran only when a developer had a
  # local Nucleus. This job runs them against a pinned published Nucleus
  # image, fresh per run.
  #
  # Why the published image and not a from-source build of the pinned
  # Neutron submodule: reproducibility and CI cost. The from-source ladder
  # breakage this comment used to document (rename visibility, migration
  # 027) was fixed upstream on 2026-09-18 (Neutron 6286531a) and
  # repo-built engines pass the full migration ladder again — the
  # lease-capability job below builds from the pin and relies on it. This
  # Supported-release coverage uses NUCLEUS_VERSION on both architectures.
  # v0.1.8 no longer satisfies the full suite (leases, parameterized paging,
  # and committed upserts); its failing run is recorded in AUDIT_OPEN.md.
  # X01: the vendor/ tree is what actually compiles, but go.mod's replace
  # points at a LOCAL Neutron checkout — nothing proved vendor/ matches the
  # pinned submodule until this check. Drift here means the shipped build
  # and the reviewed pin are different code.
  vendor-pin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Vendored neutron-go must equal the pinned submodule
        run: |
          # Invariant: every file under vendor/github.com/neutron-build/neutron/go
          # is byte-identical to the same path under the Neutron submodule pin;
          # vendored files absent from the pin are drift. LICENSE is exempt
          # (carried for license compliance, not build input). NOT a whole-tree
          # diff: the pin legitimately contains packages vendor/ doesn't import.
          cd vendor/github.com/neutron-build/neutron/go
          find . -type f | while read f; do
            [ "$f" = "./LICENSE" ] && continue
            if [ ! -e "../../../../../Neutron/go/$f" ]; then
              echo "VENDOR-ONLY: $f"
            elif ! cmp -s "$f" "../../../../../Neutron/go/$f"; then
              echo "CONTENT-DIFF: $f"
            fi
          done > /tmp/parity-drift.txt
          if [ -s /tmp/parity-drift.txt ]; then
            cat /tmp/parity-drift.txt >&2
            echo "vendor/github.com/neutron-build/neutron/go differs from the Neutron submodule pin." >&2
            echo "Regenerate from the pin (worktree the pin, point go.mod's replace at it," >&2
            echo "go mod vendor, restore the workspace replace) and commit both together." >&2
            exit 1
          fi

  # X01 compatibility matrix: the same suite against the engine version
  # production actually runs (NUCLEUS_VERSION, kept in sync with teploy.yml)
  # on arm64. This combination found two
  # real defects the v0.1.8 job structurally cannot see (the version-tie
  # ambiguity — fast native runs collide at millisecond granularity while
  # slower CI engines never do — and the v0.1.8 arm64 image is broken
  # outright: GLIBC_2.38 not found). Do not remove; widen deliberately.
  nucleus-integration-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Start pinned Nucleus
        run: |
          docker run -d --name nucleus -p 127.0.0.1:55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:${{ env.NUCLEUS_VERSION }} \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-migration-boot \
          OBSERVE_JWT_SECRET=ci-only-migration-secret-at-least-32-characters \
          /tmp/observe &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Full suite against pinned Nucleus
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
        run: go test -p 1 ./...

  nucleus-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Start pinned Nucleus
        run: |
          docker run -d --name nucleus -p 127.0.0.1:55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:${{ env.NUCLEUS_VERSION }} \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-migration-boot \
          OBSERVE_JWT_SECRET=ci-only-migration-secret-at-least-32-characters \
          /tmp/observe &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Full suite against live Nucleus
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
        # Serial: concurrent packages racing schema.Apply trip the known
        # upstream Migrate ledger TOCTOU (documented in AUDIT_OPEN.md).
        run: go test -p 1 ./...

  # e2e (AUD-056 remainder): smoke + core — login -> dashboard renders ->
  # one replay plays/pauses/seeks -> audit view renders — against the real
  # binary + real Nucleus. The fuller e2e suite is still local-only; this is
  # the honest browser-level check of the product's core surface.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start pinned Nucleus
        run: |
          docker run -d --name nucleus -p 127.0.0.1:55432:5432 \
            -e NUCLEUS_ALLOW_NO_AUTH=1 \
            -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 \
            -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            ghcr.io/neutron-build/nucleus:${{ env.NUCLEUS_VERSION }} \
            start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          docker logs nucleus >&2 || true
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Generate per-run test JWT secret
        # R44 (round 4): the inline literal violated the app's own >=16-char
        # policy, so the job could never pass startup validation.
        run: echo "E2E_JWT_SECRET=ci-e2e-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Boot observe (seeded)
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=observe-e2e-pass \
          OBSERVE_JWT_SECRET="$E2E_JWT_SECRET" \
          OBSERVE_SEED_DEMO=true \
          /tmp/observe >/tmp/observe-ci.log 2>&1 &
          OBS_PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$OBS_PID" 2>/dev/null; then
              cat /tmp/observe-ci.log >&2
              wait "$OBS_PID" || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          exit 1
      - name: Playwright smoke + core
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke.spec.ts tests/core.spec.ts tests/dashboard-replay-journey.spec.ts
        env:
          OBSERVE_URL: http://127.0.0.1:3000

  # TO-047: the lease capability job. The pinned v0.1.8 image predates
  # ACQUIRE SNAPSHOT LEASE, so its green runs prove nothing about the
  # consistent-backup path (lease live tests legitimately skip there).
  # This job builds the engine from the SAME pinned Neutron revision the
  # go.mod replace points the working tree at, boots it, applies the
  # migration ladder, and runs the backup/lease suites with
  # OBSERVE_REQUIRE_SNAPSHOT_LEASE=1 — a missing lease FAILS instead of
  # skipping, so a green run means the snapshot-lease guarantee actually
  # executed against the source the product compiles against.
  nucleus-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned Neutron revision
        id: pin
        run: echo "sha=$(git ls-tree HEAD Neutron | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../Neutron/nucleus/target
          key: nucleus-lease-${{ steps.pin.outputs.sha }}
      - name: Clone Neutron at the pinned revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/neutron-build/neutron ../Neutron
          git -C ../Neutron checkout "${{ steps.pin.outputs.sha }}"
      - name: Build engine
        run: cargo build --release --manifest-path ../Neutron/nucleus/Cargo.toml --bin nucleus
      - name: Start pinned-revision engine
        run: |
          ../Neutron/nucleus/target/release/nucleus start \
            --host 127.0.0.1 --port 55432 --cluster-port 55433 \
            --data /tmp/nucleus-lease-data --max-memory 512 &
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/55432) 2>/dev/null; then exec 3>&-; exit 0; fi
            sleep 1
          done
          echo "nucleus did not come up" >&2
          exit 1
      - name: Build observe
        run: go build -o /tmp/observe ./cmd/observe
      - name: Generate per-run test JWT secret
        # R44 (round 4): same policy fix as e2e-smoke.
        run: echo "LEASE_JWT_SECRET=ci-lease-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Boot once to apply migrations
        run: |
          OBSERVE_NUCLEUS_URL='postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable' \
          OBSERVE_ADMIN_PASSWORD=ci-lease-migration-boot \
          OBSERVE_JWT_SECRET="$LEASE_JWT_SECRET" \
          /tmp/observe >/tmp/observe-ci.log 2>&1 &
          OBS_PID=$!
          for i in $(seq 1 90); do
            if ! kill -0 "$OBS_PID" 2>/dev/null; then
              cat /tmp/observe-ci.log >&2
              wait "$OBS_PID" || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              kill "$OBS_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "observe did not become healthy" >&2
          kill "$OBS_PID" 2>/dev/null || true
          exit 1
      - name: Lease-required backup suite
        env:
          OBSERVE_NUCLEUS_URL: postgres://nucleus@127.0.0.1:55432/observe?sslmode=disable
          OBSERVE_REQUIRE_NUCLEUS: "1"
          OBSERVE_REQUIRE_SNAPSHOT_LEASE: "1"
        run: go test -p 1 -count=1 ./internal/backup/... ./internal/audit/... ./internal/replays/...

  sdk-sentry-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: sdk/sentry-shim
        run: npm ci && npm test && npm run build

  replay-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/regenerate-replay.sh --check

  helm-pair-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Render defaults and resolve the actual published pair
        run: |
          set -euo pipefail
          helm template release packaging/helm/observe -f packaging/helm/observe/ci/values-ci.yaml > /tmp/pair.yaml
          python3 - <<'PYPAIR'
          import re
          from pathlib import Path
          images = re.findall(r'^\s+image: ["\']?([^"\'\s]+)', Path('/tmp/pair.yaml').read_text(), re.M)
          if len(images) != 2 or any('latest' in image or ':' not in image for image in images):
              raise SystemExit('expected two explicit default image versions')
          Path('/tmp/pair-images').write_text('\n'.join(images) + '\n')
          PYPAIR
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image" > /tmp/manifest.txt
            grep -q linux/amd64 /tmp/manifest.txt
            grep -q linux/arm64 /tmp/manifest.txt
            docker pull "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' >> /tmp/pair-digests.jsonl
          done < /tmp/pair-images
      - name: Default pair real migrations, health and seeded browser acceptance
        run: |
          set -euo pipefail
          observe_image=$(sed -n '1p' /tmp/pair-images)
          nucleus_image=$(sed -n '2p' /tmp/pair-images)
          # Identify by repository, independent of template document order.
          if [[ "$observe_image" == *neutron-build/nucleus* ]]; then
            pair_swap=$observe_image; observe_image=$nucleus_image; nucleus_image=$pair_swap
          fi
          docker network create observe-helm-pair
          docker run -d --name pair-nucleus --network observe-helm-pair \
            -e NUCLEUS_ALLOW_NO_AUTH=1 -e NUCLEUS_ALLOW_INSECURE_CLUSTER=1 -e NUCLEUS_ALLOW_INSECURE_REPLICATION=1 \
            "$nucleus_image" start --host 0.0.0.0 --port 5432 --cluster-port 5433 --data /data --max-memory 512
          docker run -d --name pair-observe --network observe-helm-pair -p 127.0.0.1:3000:3000 \
            -e 'OBSERVE_NUCLEUS_URL=postgres://nucleus@pair-nucleus:5432/observe?sslmode=disable' \
            -e OBSERVE_ADMIN_PASSWORD=observe-e2e-pass -e OBSERVE_SEED_DEMO=true \
            -e OBSERVE_JWT_SECRET=ci-pair-secret-at-least-32-characters \
            -e OBSERVE_SESSION_SALT=ci-pair-disposable-salt "$observe_image"
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          "$ready"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/smoke.spec.ts tests/core.spec.ts tests/dashboard-replay-journey.spec.ts
        env:
          OBSERVE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helm-pair-${{ github.sha }}
          path: /tmp/pair-digests.jsonl
          if-no-files-found: error
      - name: Pair logs and cleanup
        if: always()
        run: |
          docker logs pair-observe || true
          docker logs pair-nucleus || true
          docker rm -f pair-observe pair-nucleus || true
          docker network rm observe-helm-pair || true

  assurance:
    if: always()
    needs: [go, go-race, govulncheck, staticcheck, tracker-contracts, ui-unit, sdk-go, sdk-browser, sdk-python, sdk-sentry-shim, ui-freshness, vendor-pin-parity, replay-freshness, nucleus-integration, nucleus-integration-arm64, nucleus-lease, e2e-smoke, helm-pair-availability]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every gate on this exact SHA
        run: python3 scripts/verify-release-assurance.py --record assurance.json
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-assurance-${{ github.sha }}
          path: assurance.json
          if-no-files-found: error
