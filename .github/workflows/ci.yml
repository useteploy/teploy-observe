name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repo embeds the built UI at cmd/observe/ui/dist/ as part of the
# repo (single-binary story). CI only needs to build + test the Go code
# — no pnpm, no Rust toolchain, no Nucleus build. Local devs run
# scripts/ui-sync.sh after editing UI sources.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Validate installer
        run: sh -n scripts/install.sh
      - name: Test
        run: go test ./...
      # AUD-056 (round 2): the concurrency-heavy packages get the race
      # detector — the batch-admission, WAL, replay-lock, and audit-head
      # regressions from this audit series are exactly the class of bug a
      # plain `go test` passes.
      - name: Race regression tests
        run: go test -race ./internal/ingest/... ./internal/audit/... ./internal/replays/... ./internal/auth/... ./internal/backup/...

  # AUD-056 (round 2): the classic replay tracker is a separately shipped
  # surface; these contract tests execute the real served script in a vm
  # sandbox (lifecycle, delivery retention, beacon policy).
  tracker-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/tracker/*.test.mjs

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Test SDK
        working-directory: sdk/go
        run: go test -race ./...

  # Audit F49: the browser and Python SDK contracts were only exercised
  # locally, so transport regressions (F29-F33, F51) passed the required
  # checks. Node 20 and Python 3.12 match the versions the SDKs declare.
  sdk-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck
        working-directory: sdk/browser
        run: |
          npm ci
          npm run typecheck
      - name: Test
        working-directory: sdk/browser
        run: npm test
      - name: Build
        working-directory: sdk/browser
        run: npm run build

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          python -m pytest tests -q
