name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repo embeds the built UI at cmd/observe/ui/dist/ as part of the
# repo (single-binary story). CI only needs to build + test the Go code
# — no pnpm, no Rust toolchain, no Nucleus build. Local devs run
# scripts/ui-sync.sh after editing UI sources.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Validate installer
        run: sh -n scripts/install.sh
      - name: Test
        run: go test ./...

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Test SDK
        working-directory: sdk/go
        run: go test ./...
