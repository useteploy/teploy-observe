# Observe — Teploy deployment template.
#
# First time:
#   teploy setup          # installs Docker + Caddy on the server
#   teploy deploy         # builds image, ships it, switches traffic
#
# Subsequent deploys:
#   teploy deploy
#
# Required env (export before running):
#   TEPLOY_OBSERVE_JWT_SECRET      — 32+ random bytes, `openssl rand -hex 32`
#   TEPLOY_OBSERVE_SESSION_SALT    — another random 32-byte string
#   TEPLOY_OBSERVE_ADMIN_PASSWORD  — initial admin password (change via /settings after)
#
# Shell-exported vars above only apply to the deploy that exports them — if
# you forget to re-export before a later `teploy deploy`, these silently
# fall back to empty, and Observe generates a fresh random JWT secret/salt
# on every restart, invalidating all sessions (only a WARN log, easy to
# miss). For a persistent deploy, set these once via
# `teploy secret set OBSERVE_JWT_SECRET=... OBSERVE_SESSION_SALT=...
# OBSERVE_ADMIN_PASSWORD=...` instead — secrets set that way always
# override this file's env: block on every future deploy, no re-export
# needed. To reset an already-seeded admin's password later (the plain
# OBSERVE_ADMIN_PASSWORD only seeds on first boot), use the
# OBSERVE_RESET_ADMIN_PASSWORD escape hatch the same way, then unset it.

app: observe
domain: observe.example.com
server: observe.example.com

# `port` is the app listener: dashboard + read API + admin. Anything Teploy
# routes `domain` to can reach the dashboard, so point `domain` here only for
# an instance you're happy to have a login page on (or gate it behind
# Cloudflare Access / a tailnet).
#
# To collect telemetry from browsers or off-network servers, run the
# ingest-only listener instead and give it its own hostname:
#
#   env:
#     OBSERVE_INGEST_ADDR: ":3001"
#     OBSERVE_PUBLIC_URL: "https://observe.example.com"
#
# then route ingest.example.com -> 3001. That port serves telemetry writes
# and 404s everything else, so the dashboard is not merely unrouted there —
# it isn't listening on it.
port: 3000
platform: linux/amd64

# Build mode: with no `image` set, Teploy builds from the repo Dockerfile.
# Default (build_local unset) builds on the server — best for this vendored
# Go module, since it compiles natively for the server's arch with no local
# Docker or cross-build needed. Set `build_local: true` to build on your
# machine and ship the image over SSH instead, or set
# `image: ghcr.io/useteploy/teploy-observe` to pull a prebuilt image.

# Graceful shutdown — give ingest buffer 30s to flush before SIGKILL.
stop_timeout: 30

# Nucleus runs as a Teploy accessory (separate container, sidecar to observe).
# Teploy names the accessory's network alias `<app>-<name>`, so observe
# reaches it at `observe-nucleus:5432` (see OBSERVE_NUCLEUS_URL below).
accessories:
  nucleus:
    image: ghcr.io/neutron-build/nucleus:latest
    port: 5432
    env:
      # Single-node sidecar on a private network: allow no-auth SQL and the
      # cluster/replication transports to bind non-loopback without a token.
      NUCLEUS_ALLOW_NO_AUTH: "1"
      NUCLEUS_ALLOW_INSECURE_CLUSTER: "1"
      NUCLEUS_ALLOW_INSECURE_REPLICATION: "1"
      # Memory budget shared by all engine subsystems. The engine defaults to
      # 512 MB and REJECTS WRITES at 90% RSS — far too small once a real
      # dataset is resident (a ~5 GB observe store idles above 3 GB RSS).
      # Size to roughly 2x resident data, below host headroom.
      NUCLEUS_MAX_MEMORY_MB: "8192"
    volumes:
      nucleus-data: /data

  # Self-hosted S3: the backup + restore-test target for this stack (no
  # external object storage needed). Loopback-published so the host-side
  # `aws` CLI that teploy backup shells out to can reach it; never exposed
  # publicly. Console (:9001) stays network-internal.
  minio:
    image: minio/minio:latest
    port: 9000
    command: server /data --console-address :9001
    publish:
      - 127.0.0.1:9100:9000
    env:
      MINIO_ROOT_USER: teploy-backup
      MINIO_ROOT_PASSWORD: secret:MINIO_ROOT_PASSWORD
    volumes:
      minio-data: /data

env:
  OBSERVE_ADDR: ":3000"
  OBSERVE_NUCLEUS_URL: "postgres://observe-nucleus:5432/observe"
  OBSERVE_SITE_ID: "default"
  OBSERVE_SESSION_SALT: "${TEPLOY_OBSERVE_SESSION_SALT}"
  OBSERVE_JWT_SECRET: "${TEPLOY_OBSERVE_JWT_SECRET}"
  OBSERVE_ADMIN_USER: "admin"
  OBSERVE_ADMIN_PASSWORD: "${TEPLOY_OBSERVE_ADMIN_PASSWORD}"
  OBSERVE_BUFFER_SIZE: "100000"
  OBSERVE_FLUSH_INTERVAL_MS: "2000"
  OBSERVE_FLUSH_SIZE: "500"
  OBSERVE_RAW_RETENTION_DAYS: "30"
  OBSERVE_HOURLY_RETENTION_DAYS: "365"
  OBSERVE_SEED_DEMO: "false"

volumes:
  observe-state: /var/lib/observe

# Optional: Slack webhook on deploy success/failure.
# notifications:
#   webhook: https://hooks.slack.com/services/YOUR/WEBHOOK/URL

hooks:
  post_deploy: |
    echo "Observe deployed to https://${TEPLOY_DOMAIN}/"
    echo "Admin: admin / \${OBSERVE_ADMIN_PASSWORD} — change via /settings."
