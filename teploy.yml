# Observe — Teploy deployment template.
#
# First time:
#   teploy setup          # installs Docker + Caddy on the server
#   teploy deploy         # builds image, ships it, switches traffic
#
# Subsequent deploys:
#   teploy deploy
#
# Required env (export before running):
#   TEPLOY_OBSERVE_JWT_SECRET      — 32+ random bytes, `openssl rand -hex 32`
#   TEPLOY_OBSERVE_SESSION_SALT    — another random 32-byte string
#   TEPLOY_OBSERVE_ADMIN_PASSWORD  — initial admin password (change via /settings after)
#
# Shell-exported vars above only apply to the deploy that exports them — if
# you forget to re-export before a later `teploy deploy`, these silently
# fall back to empty, and Observe generates a fresh random JWT secret/salt
# on every restart, invalidating all sessions (only a WARN log, easy to
# miss). For a persistent deploy, set these once via
# `teploy secret set OBSERVE_JWT_SECRET=... OBSERVE_SESSION_SALT=...
# OBSERVE_ADMIN_PASSWORD=...` instead — secrets set that way always
# override this file's env: block on every future deploy, no re-export
# needed. To reset an already-seeded admin's password later (the plain
# OBSERVE_ADMIN_PASSWORD only seeds on first boot), use the
# OBSERVE_RESET_ADMIN_PASSWORD escape hatch the same way, then unset it.

app: observe
domain: observe.example.com
server: observe.example.com

# Ingress + binds. The dashboard/read API (`port`) is deliberately NOT on
# 0.0.0.0: anything reaching it gets a login page, so it is pinned to the
# tailnet address. The INGEST listener is the opposite - it must stay on
# 0.0.0.0 because the tunnel fronting the public ingest hostname may dial
# either address. Losing either silently breaks a live install: without
# `publish` nothing listens on 3001 at all and every SDK write is refused.
ingress: host
bind: 100.108.123.49
publish:
  - "0.0.0.0:3001:3001"

# `port` is the app listener: dashboard + read API + admin. Anything Teploy
# routes `domain` to can reach the dashboard, so point `domain` here only for
# an instance you're happy to have a login page on (or gate it behind
# Cloudflare Access / a tailnet).
#
# To collect telemetry from browsers or off-network servers, run the
# ingest-only listener instead and give it its own hostname:
#
#   env:
#     OBSERVE_INGEST_ADDR: ":3001"
#     OBSERVE_PUBLIC_URL: "https://observe.example.com"
#
# then route ingest.example.com -> 3001. That port serves telemetry writes
# and 404s everything else, so the dashboard is not merely unrouted there —
# it isn't listening on it.
port: 3000
platform: linux/amd64

# Build mode: with no `image` set, Teploy builds from the repo Dockerfile.
# Default (build_local unset) builds on the server — best for this vendored
# Go module, since it compiles natively for the server's arch with no local
# Docker or cross-build needed. Set `build_local: true` to build on your
# machine and ship the image over SSH instead, or set
# `image: ghcr.io/useteploy/teploy-observe` to pull a prebuilt image.

# Graceful shutdown — give ingest buffer 30s to flush before SIGKILL.
stop_timeout: 30

# Nucleus runs as a Teploy accessory (separate container, sidecar to observe).
# Teploy names the accessory's network alias `<app>-<name>`, so observe
# reaches it at `observe-nucleus:5432` (see OBSERVE_NUCLEUS_URL below).
accessories:
  nucleus:
    # Pin the engine. `:latest` is republished on every push to Nucleus's main,
    # so with a floating tag an unrelated redeploy swaps the storage engine
    # underneath a live database — and the tag moves between the day you test
    # and the day you deploy. Bump this deliberately, after reading the
    # release's migration notes.
    #
    # v0.1.8 (2026-08-21), up from v0.1.5. Verified before bumping: Observe's
    # suite passes against it, 34 packages, same as 0.1.6 — while v0.1.5 fails
    # auth/cohorts/errors because migration 28 cannot run on a fresh database
    # (`events_pre028 not found in storage`). The one package that still fails
    # on BOTH engines is `internal/cohorts`, which is Observe's own known
    # `events_recent` gap (no `distinct_id`), order-dependent and unrelated to
    # the engine. v0.1.6's breaking change applies: SKIP LOCKED, NOWAIT and
    # partial CREATE INDEX ... WHERE now error rather than being ignored —
    # checked, neither Observe nor Ship uses them.
    #
    # v1.0.0 (2026-08-31), up from v0.1.8. Two wire-protocol fixes are why this
    # release exists. The RowDescription a client received did not always
    # describe the DataRows that followed it — 20,800 of 125,419 statements
    # over a ten-second concurrent read were answered with a description that
    # did not match their rows, and a client reading fields positionally throws
    # while one reading by name silently decodes a row with fields missing.
    # And Describe could EXECUTE a side-effecting statement, because whether to
    # describe statically or by running the statement was decided by a text
    # scan that a comment between a function name and its arguments defeats.
    #
    # ROLLING BACK TO v0.1.8 IS NOT A BINARY SWAP. DB_FORMAT_VERSION is still
    # 2, so the engine will NOT refuse the older binary, and the rollback
    # runbook's decision tree tells you to try exactly that first. S63 added
    # transaction-tagged KV WAL records (0x06-0x09) that 0.1.8 has no case for;
    # its replay fallthrough is RecordStep::Stop, so it treats the first tagged
    # record as end-of-log and silently discards every KV record after it. The
    # tags appear only where a KV mutation runs inside a coordinating SQL
    # transaction. A v0.1.8 physical snapshot still restores into v1.0.0, so
    # the pre-upgrade backup is the way back — fix forward, do not swap.
    image: ghcr.io/neutron-build/nucleus:v1.0.0
    port: 5432
    # Hard cgroup cap, and the only bound the kernel enforces.
    # NUCLEUS_MAX_MEMORY_MB below is the engine's accounting of its OWN
    # allocations: a leak in a path it does not count sails past it. This
    # engine once reached 30 GB RSS with that budget set to 16 GB and the host
    # OOM killer took an unrelated service down with it. Keep this ABOVE the
    # engine budget so graceful eviction runs first and the kernel cap is only
    # the backstop; size both to the host.
    memory: 10g
    env:
      # Single-node sidecar on a private network: allow no-auth SQL and the
      # cluster/replication transports to bind non-loopback without a token.
      NUCLEUS_ALLOW_NO_AUTH: "1"
      NUCLEUS_ALLOW_INSECURE_CLUSTER: "1"
      NUCLEUS_ALLOW_INSECURE_REPLICATION: "1"
      # Memory budget shared by all engine subsystems. The engine defaults to
      # 512 MB and REJECTS WRITES at 90% RSS — far too small once a real
      # dataset is resident (a ~5 GB observe store idles above 3 GB RSS).
      # Size to roughly 2x resident data, below host headroom.
      NUCLEUS_MAX_MEMORY_MB: "8192"
    volumes:
      nucleus-data: /data

  # Self-hosted S3: the backup + restore-test target for this stack (no
  # external object storage needed). Loopback-published so the host-side
  # `aws` CLI that teploy backup shells out to can reach it; never exposed
  # publicly. Console (:9001) stays network-internal.
  minio:
    image: minio/minio:latest
    port: 9000
    command: server /data --console-address :9001
    publish:
      - 127.0.0.1:9100:9000
    env:
      MINIO_ROOT_USER: teploy-backup
      MINIO_ROOT_PASSWORD: secret:MINIO_ROOT_PASSWORD
    volumes:
      minio-data: /data

env:
  OBSERVE_ADDR: ":3000"
  OBSERVE_INGEST_ADDR: ":3001"
  # Suite header: the `Teploy [Product v]` switcher in the top-left renders
  # only when it knows where its siblings live. These are plain URLs, not
  # secrets, and they belong here rather than being set by hand -- a deploy
  # from a config that omits them silently drops the switcher, which is
  # exactly how it disappeared on 2026-08-25.
  TEPLOY_NAV_DASH_URL: "http://100.108.123.49:3456"
  # Ship moved to infra-home 2026-08-27 (its sandboxes run on compute-1, which
  # is what lets its control plane sit beside the forge).
  TEPLOY_NAV_SHIP_URL: "http://100.108.123.49:7460"
  OBSERVE_NUCLEUS_URL: "postgres://observe-nucleus:5432/observe"
  OBSERVE_SITE_ID: "default"
  OBSERVE_SESSION_SALT: "${TEPLOY_OBSERVE_SESSION_SALT}"
  OBSERVE_JWT_SECRET: "${TEPLOY_OBSERVE_JWT_SECRET}"
  OBSERVE_ADMIN_USER: "admin"
  OBSERVE_ADMIN_PASSWORD: "${TEPLOY_OBSERVE_ADMIN_PASSWORD}"
  OBSERVE_BUFFER_SIZE: "100000"
  OBSERVE_FLUSH_INTERVAL_MS: "2000"
  OBSERVE_FLUSH_SIZE: "500"
  OBSERVE_RAW_RETENTION_DAYS: "30"
  OBSERVE_HOURLY_RETENTION_DAYS: "365"
  OBSERVE_SEED_DEMO: "false"

volumes:
  observe-state: /var/lib/observe

# Optional: Slack webhook on deploy success/failure.
# notifications:
#   webhook: https://hooks.slack.com/services/YOUR/WEBHOOK/URL

hooks:
  post_deploy: |
    echo "Observe deployed to https://${TEPLOY_DOMAIN}/"
    echo "Admin: admin / \${OBSERVE_ADMIN_PASSWORD} — change via /settings."
