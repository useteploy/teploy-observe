{{- include "observe.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $keys := .Values.secrets.keys }}
{{- $name := include "observe.fullname" . }}
{{- /* lookup is empty under helm template / --dry-run / GitOps renderers. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- $salt := .Values.secrets.sessionSalt }}
{{- if and (not $jwt) .Values.secrets.autogenerate }}
{{- $prev := dig "data" $keys.jwtSecret "" $existing }}
{{- $jwt = ternary ($prev | b64dec) (randAlphaNum 48) (ne $prev "") }}
{{- end }}
{{- if and (not $salt) .Values.secrets.autogenerate }}
{{- $prev := dig "data" $keys.sessionSalt "" $existing }}
{{- $salt = ternary ($prev | b64dec) (randAlphaNum 48) (ne $prev "") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "observe.labels" . | nindent 4 }}
  {{- if .Values.secrets.autogenerate }}
  annotations:
    # Never delete generated secrets on uninstall: losing them logs everyone out.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  {{ $keys.jwtSecret }}: {{ $jwt | quote }}
  {{ $keys.sessionSalt }}: {{ $salt | quote }}
  {{- if .Values.secrets.secretKey }}
  {{ $keys.secretKey }}: {{ .Values.secrets.secretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  {{ $keys.adminPassword }}: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
{{- end }}
