apiVersion: v1
kind: Service
metadata:
  name: {{ include "observe.fullname" . }}
  labels:
    {{- include "observe.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "observe.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.ingest.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observe.fullname" . }}-ingest
  labels:
    {{- include "observe.labels" . | nindent 4 }}
  {{- with .Values.ingest.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ingest.service.type }}
  selector:
    {{- include "observe.selectorLabels" . | nindent 4 }}
  ports:
    - name: ingest
      port: {{ .Values.ingest.port }}
      targetPort: ingest
{{- end }}
