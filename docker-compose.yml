# Observe — self-hosted analytics, errors, logs, traces, replays.
#
# Single-host install (no TLS, localhost:3000):
#   docker compose up
#
# Production (with Caddy + auto-TLS; expose 80/443, set OBSERVE_DOMAIN):
#   OBSERVE_DOMAIN=observe.example.com docker compose --profile tls up -d
#
# Collecting telemetry from browsers or servers OUTSIDE your network?
# Don't publish the port below — it serves the dashboard too. Set
# OBSERVE_INGEST_ADDR and publish only that port, which serves telemetry
# writes and nothing else:
#
#   environment:  OBSERVE_INGEST_ADDR: ":3001"
#   ports:        - "3001:3001"        # ingest.example.com — public
#                 - "127.0.0.1:3000:3000"   # dashboard — localhost/tailnet only
#
# This is the split every hosted product uses (sentry.io vs
# o123.ingest.sentry.io, us.posthog.com vs us.i.posthog.com): the public
# hostname has no UI behind it. Backend-only telemetry over a tailnet needs
# none of this — leave it unset and keep both on the private port.
#
# First login: visit the dashboard and the /setup wizard lets you create the
# admin account interactively — there is no default password. (OBS-007: this
# compose file used to override the application's own safe defaults —
# OBSERVE_ADMIN_PASSWORD unset means "show the setup wizard", not a fixed
# admin/observe login — with a publicly documented fallback password anyone
# could use to claim a fresh, reachable instance before the operator got to
# it. JWT_SECRET/SESSION_SALT had the same problem: unset means "generate a
# random one", not a fixed publicly-known value anyone could use to forge a
# valid session token. Set OBSERVE_JWT_SECRET/OBSERVE_SESSION_SALT yourself
# only if you want sessions/visitor IDs to survive a container restart.)

services:
  nucleus:
    image: ghcr.io/neutron-build/nucleus:latest
    restart: unless-stopped
    volumes:
      - nucleus_data:/data
    command: ["start", "--port", "5432", "--cluster-port", "5433", "--data", "/data", "--max-memory", "512"]
    environment:
      NUCLEUS_ALLOW_INSECURE_CLUSTER: "1"
      NUCLEUS_ALLOW_INSECURE_REPLICATION: "1"
      NUCLEUS_ALLOW_NO_AUTH: "1"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'SELECT 1' | timeout 2 nc localhost 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  observe:
    image: ghcr.io/useteploy/teploy-observe:${OBSERVE_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      # Exposed directly for the default (no-TLS) profile.
      # With the "tls" profile, Caddy handles 80/443 and observe stays internal.
      # NOTE: this port serves the dashboard as well as ingest — see the
      # OBSERVE_INGEST_ADDR note at the top before exposing it publicly.
      - "3000:3000"
    environment:
      OBSERVE_ADDR: ":3000"
      OBSERVE_NUCLEUS_URL: "postgres://nucleus:5432/observe"
      OBSERVE_DATA_DIR: "/var/lib/observe"
      OBSERVE_SITE_ID: "default"
      OBSERVE_SESSION_SALT: "${OBSERVE_SESSION_SALT:-}"
      OBSERVE_BUFFER_SIZE: "100000"
      OBSERVE_FLUSH_INTERVAL_MS: "2000"
      OBSERVE_FLUSH_SIZE: "500"
      OBSERVE_RAW_RETENTION_DAYS: "30"
      OBSERVE_HOURLY_RETENTION_DAYS: "365"
      OBSERVE_JWT_SECRET: "${OBSERVE_JWT_SECRET:-}"
      OBSERVE_ADMIN_USER: "${OBSERVE_ADMIN_USER:-admin}"
      OBSERVE_ADMIN_PASSWORD: "${OBSERVE_ADMIN_PASSWORD:-}"
      OBSERVE_SEED_DEMO: "${OBSERVE_SEED_DEMO:-true}"
    volumes:
      - observe_data:/var/lib/observe
    depends_on:
      nucleus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: Caddy reverse proxy with automatic TLS via Let's Encrypt.
  # Enable with:  docker compose --profile tls up -d
  # Requires OBSERVE_DOMAIN to point at this host and ports 80/443 open.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [tls]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command:
      - caddy
      - reverse-proxy
      - --from
      - "${OBSERVE_DOMAIN:-observe.localhost}"
      - --to
      - "observe:3000"
    depends_on:
      observe:
        condition: service_healthy

volumes:
  nucleus_data:
  observe_data:
  caddy_data:
  caddy_config:
